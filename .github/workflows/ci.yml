name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq shellcheck

      - name: Shellcheck
        run: |
          shellcheck bin/*.sh setup/install.sh tests/*.sh
          (cd hooks && shellcheck -x *.sh)

      - name: Validate kb/
        run: bin/kb-validate.sh

      - name: Integration tests
        run: bash tests/run.sh

      - name: Performance smoke (1000 notes)
        run: bash tests/perf_smoke.sh
        env:
          PERF_MAX_SEC: "20"
