name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq shellcheck

      - name: Shellcheck
        run: shellcheck bin/*.sh hooks/*.sh setup/install.sh tests/run.sh scripts/*.sh

      - name: Integration tests
        run: bash tests/run.sh
